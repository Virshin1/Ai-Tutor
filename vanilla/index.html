<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Tools AI Tutor Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#181A20',
                        card: '#23262F',
                        accentYellow: '#FFE066',
                        accentBlue: '#5BC0EB',
                        accentPurple: '#A389F4',
                        accentGreen: '#6EE7B7',
                        accentPink: '#FF6F91',
                        accentOrange: '#FFD166',
                        textPrimary: '#FFFFFF',
                        textSecondary: '#A3A3A3',
                    },
                    borderRadius: {
                        'xl': '1.25rem',
                        '2xl': '2rem',
                        '3xl': '2.5rem',
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="min-h-screen bg-background text-textPrimary font-sans">
    <!-- Header -->
    <header class="bg-card shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="#" class="flex items-center space-x-2" onclick="navigateTo('dashboard')">
                        <i data-lucide="graduation-cap" class="h-8 w-8 text-accentBlue"></i>
                        <span class="text-2xl font-extrabold text-white tracking-tight">AI Tutor Tools</span>
                    </a>
                </div>
                <nav class="flex space-x-2">
                    <a href="#" onclick="navigateTo('dashboard')" 
                       class="nav-item flex items-center gap-2 px-4 py-2 rounded-xl font-semibold transition-colors focus:outline-none text-base"
                       data-page="dashboard">
                        <i data-lucide="graduation-cap" class="h-5 w-5"></i>
                        <span>Tools</span>
                    </a>
                    <a href="#" onclick="navigateTo('documents')" 
                       class="nav-item flex items-center gap-2 px-4 py-2 rounded-xl font-semibold transition-colors focus:outline-none text-base"
                       data-page="documents">
                        <i data-lucide="file-text" class="h-5 w-5"></i>
                        <span>Documents</span>
                    </a>
                    <a href="#" onclick="navigateTo('analytics')" 
                       class="nav-item flex items-center gap-2 px-4 py-2 rounded-xl font-semibold transition-colors focus:outline-none text-base"
                       data-page="analytics">
                        <i data-lucide="bar-chart-3" class="h-5 w-5"></i>
                        <span>Dashboard</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="min-h-screen">
        <!-- Content will be dynamically loaded here -->
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-accentBlue text-background px-6 py-3 rounded-xl shadow-lg z-50 transition-opacity duration-400 opacity-0 pointer-events-none">
        <span id="toast-message"></span>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="animate-spin rounded-full h-32 w-32 border-b-2 border-accentBlue"></div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/router.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
